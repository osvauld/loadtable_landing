[build]
  command = "npm run build && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Each page carries its own policy in a <meta> tag (Layout.astro); the header adds what a meta tag can't.
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
